<!-- Auth Navigation Component -->
<div class="auth-nav">
    <div class="auth-nav-brand">
        <a href="{% url 'core:landing' %}" class="auth-brand-link">
            <i class="bi bi-globe-africa"></i>
            <span>SafariSmart Kenya</span>
        </a>
    </div>
    
    <div class="auth-nav-links">
        {% if request.resolver_match.url_name == 'login' %}
            <span class="auth-nav-link active">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </span>
            <a href="{% url 'accounts:register' %}" class="auth-nav-link">
                <i class="bi bi-person-plus"></i> Sign Up
            </a>
        {% elif request.resolver_match.url_name == 'register' %}
            <a href="{% url 'accounts:login' %}" class="auth-nav-link">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <span class="auth-nav-link active">
                <i class="bi bi-person-plus"></i> Sign Up
            </span>
        {% elif 'password_reset' in request.resolver_match.url_name %}
            <span class="auth-nav-link active">
                <i class="bi bi-key"></i> Reset Password
            </span>
            <a href="{% url 'accounts:login' %}" class="auth-nav-link">
                <i class="bi bi-box-arrow-in-right"></i> Back to Login
            </a>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="auth-nav-link">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
            <a href="{% url 'accounts:register' %}" class="auth-nav-link">
                <i class="bi bi-person-plus"></i> Sign Up
            </a>
        {% endif %}
    </div>
</div>

<style>
.auth-nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.auth-brand-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.25rem;
    transition: all 0.3s ease;
}

.auth-brand-link:hover {
    color: rgba(255, 255, 255, 0.9);
    transform: scale(1.05);
}

.auth-brand-link i {
    font-size: 1.5rem;
}

.auth-nav-links {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.auth-nav-link {
    color: rgba(255, 255, 255, 0.9);
    text-decoration: none;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-weight: 500;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.auth-nav-link:hover {
    color: white;
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
}

.auth-nav-link.active {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    cursor: default;
}

@media (max-width: 768px) {
    .auth-nav {
        padding: 1rem;
        flex-direction: column;
        gap: 1rem;
    }
    
    .auth-nav-links {
        gap: 0.5rem;
    }
    
    .auth-nav-link {
        font-size: 0.8rem;
        padding: 0.4rem 0.8rem;
    }
    
    .auth-brand-link {
        font-size: 1.1rem;
    }
}
</style>
