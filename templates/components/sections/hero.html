{% load static %}

<section class="hero-immersive">
    <!-- 1. VIDEO CONTAINER (The Fix) -->
    <!-- Background color black hides the green flash -->
    <div class="hero-video-container" style="background-color: #000;">
        <video 
            id="hero-video" 
            autoplay 
            muted 
            playsinline 
            class="hero-video" 
            poster="{% static 'images/heroes/maasai-mara-hero.jpg' %}"
            style="transition: opacity 0.5s ease; width: 100%; height: 100%; object-fit: cover;"
            data-sources='[
                "{% static "videos/video1.mp4" %}",
                "{% static "videos/video2.mp4" %}",
                "{% static "videos/video3.mp4" %}"
            ]'>
            <!-- Initial Video Source -->
            <source src="{% static 'videos/video1.mp4' %}" type="video/mp4">
        </video>
    </div>

    <!-- 2. OVERLAY CONTENT -->
    <div class="hero-overlay">
        <div class="hero-split-container">
            <div class="hero-content-side">
                <div class="hero-constellation">
                    <!-- Badge -->
                    <div class="hero-badge">
                        <i class="bi bi-stars"></i>
                        <span>Curated Kenyan Journeys</span>
                    </div>
                    
                    <!-- Title -->
                    <h1 class="hero-proclamation">
                        Witness the majestic beauty of
                        <br>
                        <span class="gradient-shimmer">Authentic Kenya</span>
                    </h1>
                    
                    <!-- Manifesto -->
                    <p class="hero-manifesto">
                        From the golden sunrises of the Maasai Mara to the crystal waters of Diani Beach. 
                        Design a safari that moves at your pace, tailored to your style.
                    </p>
                
                    <!-- Action Buttons -->
                    <div class="hero-cta">
                        <a href="{% url 'core:destination_selection' %}" class="btn-modern btn-primary-modern">
                            <i class="bi bi-compass-fill"></i>
                            <span>Start Your Journey</span>
                        </a>
                        
                        <a href="{% url 'destinations:list' %}" class="btn-modern btn-secondary-modern">
                            <i class="bi bi-eye"></i>
                            <span>Discover Places</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
