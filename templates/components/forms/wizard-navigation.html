<!-- Wizard Navigation Component -->
<div class="wizard-navigation">
    {% if show_back %}
    <a href="{{ back_url }}" class="btn-back">
        <i class="bi bi-arrow-left"></i>
        {{ back_text|default:"Back" }}
    </a>
    {% else %}
    <div></div>
    {% endif %}
    
    <button type="submit" class="btn-next" {% if disabled %}disabled{% endif %}>
        {{ next_text|default:"Continue" }}
        <i class="bi bi-arrow-right"></i>
    </button>
</div>
