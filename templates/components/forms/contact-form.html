<!-- Contact Form Component -->
<div class="contact-form">
    <h3><i class="bi bi-envelope"></i> Send us a Message</h3>
    <p>Fill out the form below and we'll get back to you as soon as possible.</p>
    
    <form id="contactForm" method="post" action="#" class="contact-form-fields">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="subject">Subject *</label>
            <select id="subject" name="subject" required>
                <option value="">Select a topic</option>
                <option value="general">General Inquiry</option>
                <option value="support">Technical Support</option>
                <option value="feedback">Feedback</option>
                <option value="partnership">Partnership</option>
                <option value="bug">Bug Report</option>
                <option value="feature">Feature Request</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="6" placeholder="Tell us how we can help you..." required></textarea>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn-contact">
                <i class="bi bi-send"></i>
                Send Message
            </button>
        </div>
    </form>
    
    <div id="form-success" class="alert alert-success" style="display: none;">
        <i class="bi bi-check-circle"></i>
        Thank you for your message! We'll get back to you within 24 hours.
    </div>
    
    <div id="form-error" class="alert alert-error" style="display: none;">
        <i class="bi bi-exclamation-triangle"></i>
        Sorry, there was an error sending your message. Please try again or email us directly.
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('contactForm');
    const successAlert = document.getElementById('form-success');
    const errorAlert = document.getElementById('form-error');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Get form data
        const formData = new FormData(form);
        const data = Object.fromEntries(formData);
        
        // Simple validation
        if (!data.name || !data.email || !data.subject || !data.message) {
            showError('Please fill in all required fields.');
            return;
        }
        
        // Show loading state
        const submitBtn = form.querySelector('.btn-contact');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Sending...';
        submitBtn.disabled = true;
        
        // Simulate form submission (replace with actual endpoint)
        setTimeout(() => {
            // Reset button
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            
            // Show success message
            showSuccess();
            form.reset();
            
            // Track analytics
            if (typeof gtag !== 'undefined') {
                gtag('event', 'contact_form_submit', {
                    'event_category': 'engagement',
                    'subject': data.subject
                });
            }
        }, 1500);
    });
    
    function showSuccess() {
        errorAlert.style.display = 'none';
        successAlert.style.display = 'block';
        successAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        setTimeout(() => {
            successAlert.style.display = 'none';
        }, 5000);
    }
    
    function showError(message) {
        successAlert.style.display = 'none';
        errorAlert.innerHTML = '<i class="bi bi-exclamation-triangle"></i> ' + message;
        errorAlert.style.display = 'block';
        errorAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        setTimeout(() => {
            errorAlert.style.display = 'none';
        }, 5000);
    }
});
</script>

<style>
.contact-form-fields {
    margin-top: 1.5rem;
}

.contact-form-fields .row {
    margin: 0 -0.5rem;
}

.contact-form-fields .col-md-6 {
    padding: 0 0.5rem;
}

.form-group select {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    background: white;
    transition: border-color 0.3s ease;
}

.form-group select:focus {
    outline: none;
    border-color: #E07A2B;
    box-shadow: 0 0 0 3px rgba(224, 122, 43, 0.1);
}

.alert {
    padding: 1rem;
    border-radius: 8px;
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.alert-success {
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #a7f3d0;
}

.alert-error {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
}

.btn-contact:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

@media (max-width: 768px) {
    .contact-form-fields .row {
        margin: 0;
    }
    
    .contact-form-fields .col-md-6 {
        padding: 0;
        margin-bottom: 1rem;
    }
}
</style>
