{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 text-center p-5">
                <i class="fas fa-check-circle text-success fa-5x mb-4"></i>
                <h2 class="mb-3">Payment Successful!</h2>
                <p class="text-muted mb-4">{{ message }}</p>
                <p class="mb-4">Thank you for supporting SafariSmart Kenya. Your contribution helps us continue
                    providing free trip planning tools to travelers worldwide.</p>
                <a href="{% url 'core:landing' %}" class="btn btn-primary btn-lg">Return to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
