{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 text-center p-5">
                <i class="fas fa-times-circle text-danger fa-5x mb-4"></i>
                <h2 class="mb-3">Payment Failed</h2>
                <p class="text-muted mb-4">{{ message }}</p>
                <p class="mb-4">If you believe this is an error, please contact our support team.</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'payments:sponsorship' %}" class="btn btn-primary btn-lg">Try Again</a>
                    <a href="{% url 'core:landing' %}" class="btn btn-outline-secondary">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
