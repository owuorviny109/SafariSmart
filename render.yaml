services:
  - type: web
    name: safarismart-kenya
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn safarismart.wsgi:application --env DJANGO_SETTINGS_MODULE=safarismart.settings_production"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: safarismart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com

databases:
  - name: safarismart-db
    databaseName: safarismart
    user: safarismart
